name: Generate package-lock.json

on:
  workflow_dispatch: # Allows manual runs from the Actions tab
  push:
    paths:
      - 'package.json' # Triggers automatically when package.json changes

permissions:
  contents: write # Required to push the generated lockfile back to the repo

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only
          touch metro.config.js


      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet || git commit -m "chore: update package-lock.json"
          git push
          
